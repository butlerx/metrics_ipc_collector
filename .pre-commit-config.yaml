update:
  cooldown_days: 7
  freeze: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: 3251597d6d00583a75057ea11da9fcb66a588198 # frozen: v1.5.5
    hooks:
      - id: tombi-format
      - id: tombi-lint

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt

  # Runs after yamlfmt so it only reports what a formatter cannot fix.
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args:
          - --strict

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        pass_filenames: false
        args:
          # https://github.com/zizmorcore/zizmor/issues/582
          - '--no-progress'
          - '.github'

  - repo: local
    hooks:
      # rustfmt and clippy come from the toolchain mise installs,
      # not a hook env, so the hook and `cargo fmt` cannot disagree.
      - id: rustfmt
        name: rustfmt
        language: system
        entry: cargo fmt --all --
        types:
          - rust
        pass_filenames: false
      - id: clippy
        name: clippy
        language: system
        entry: cargo clippy --all-targets -- -D warnings
        types:
          - rust
        pass_filenames: false
